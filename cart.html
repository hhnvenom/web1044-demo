<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhà sách Bean — Giỏ hàng</title>
  <link rel="stylesheet" href="css/style.css">
</head>

    <a class="logo" href="index.html">📚 Nhà sách Bean</a>

      <a class="btn" href="index.html">← Tiếp tục mua</a>

  <footer class="footer">Assignment mẫu WEB1044 — chủ đề nhà sách</footer>

  <script src="js/data.js"></script>
