<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop của tôi — Đăng ký</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a class="logo" href="index.html">🛍️ Shop của tôi</a>
    <nav class="nav">
      <a href="index.html">Sản phẩm</a>
      <a href="cart.html">Giỏ hàng</a>
      <a href="register.html">Đăng ký</a>
    </nav>
  </header>

  <main class="container">
    <h1>Đăng ký thành viên</h1>

    <!-- TODO (buổi 8): thêm kiểm tra dữ liệu bằng JS, KHÔNG dựa vào required của HTML -->
    <form id="register-form" class="form" novalidate>
      <div class="field">
        <label for="name">Họ tên</label>
        <input id="name" name="name" type="text">
        <small class="error" data-for="name"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
        <small class="error" data-for="email"></small>
      </div>

      <!-- TODO: thêm ô số điện thoại và mật khẩu -->

      <button type="submit" class="btn btn-primary">Đăng ký</button>
      <p id="register-message" class="message"></p>
    </form>
  </main>

  <footer class="footer">Assignment WEB1044 — FPT Polytechnic</footer>

  <script src="js/data.js"></script>
  <script src="js/models.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/render.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
