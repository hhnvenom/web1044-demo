<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cà phê — Bài 7 · Demo 4</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>☕ Cà phê WEB1044</h1></header>

  <main>
    <!-- Demo 1: một nút, một listener -->
    <section class="demo">
      <h2>Demo 1 — addEventListener</h2>
      <button id="btn">Thêm giỏ hàng</button>
      <p id="out"></p>
    </section>

    <!-- Demo 2: một listener cho cả danh sách -->
    <section class="demo">
      <h2>Demo 2 — event delegation</h2>
      <div id="ds">
        <button class="mua-nho" data-ten="Arabica">Mua</button>
        <button class="mua-nho" data-ten="Robusta">Mua</button>
        <button class="mua-nho" data-ten="Cà phê xanh">Mua</button>
      </div>
      <p id="out-ds"></p>
    </section>

    <!-- Demo 3: hiệu ứng ẩn hiện bằng class -->
    <section class="demo">
      <h2>Demo 3 — hiệu ứng ẩn hiện</h2>
      <div id="box">Chào mừng đến với website của chúng tôi</div>
      <button id="btn-box">Hiện / Ẩn</button>
      <p class="ghi-chu">Khối trên còn tự hiện ở giây thứ 2 và tự ẩn ở giây thứ 5.</p>
    </section>

    <h2>Sản phẩm</h2>
    <div id="danh-sach" class="grid"></div>

    <section id="gio-khung">
      <h2>🛒 Giỏ hàng</h2>
      <div id="gio"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
