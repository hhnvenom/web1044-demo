<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean Corner — Shop cà phê</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a href="#" class="logo">☕ Bean Corner</a>
    <nav class="nav">
      <a href="#products">Sản phẩm</a>
      <a href="#register">Đăng ký</a>
    </nav>
    <div class="header-actions">
      <button id="theme-toggle" class="btn btn-ghost" title="Đổi giao diện sáng/tối">🌙</button>
      <button id="cart-toggle" class="btn btn-primary">🛒 Giỏ hàng <span id="cart-count" class="badge">0</span></button>
    </div>
  </header>

  <section class="hero">
    <h1>Cà phê ngon, code cũng ngon</h1>
    <p>Website bán hàng viết bằng HTML, CSS và JavaScript thuần — sản phẩm cuối môn WEB1044.</p>
    <a href="#products" class="btn btn-primary">Xem menu</a>
  </section>

  <main class="container">
    <section id="products">
      <div class="section-head">
        <h2>Menu</h2>
        <div id="filters" class="filters"></div>
      </div>
      <div id="product-list" class="grid"></div>
    </section>

    <section id="register" class="register">
      <h2>Đăng ký thành viên</h2>
      <p class="muted">Nhận ưu đãi 10% cho đơn đầu tiên.</p>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Họ tên</label>
          <input id="name" name="name" type="text" placeholder="Nguyen Van A">
          <small class="error" data-for="name"></small>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="a@example.com">
          <small class="error" data-for="email"></small>
        </div>
        <div class="field">
          <label for="phone">Số điện thoại</label>
          <input id="phone" name="phone" type="tel" placeholder="09xxxxxxxx">
          <small class="error" data-for="phone"></small>
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input id="password" name="password" type="password" placeholder="Ít nhất 6 ký tự">
          <small class="error" data-for="password"></small>
        </div>
        <button type="submit" class="btn btn-primary">Đăng ký</button>
        <p id="register-message" class="message"></p>
      </form>
    </section>
  </main>

  <aside id="cart" class="cart" aria-hidden="true">
    <div class="cart-head">
      <h2>Giỏ hàng</h2>
      <button id="cart-close" class="btn btn-ghost">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-foot">
      <div class="total">Tổng: <strong id="cart-total">0 đ</strong></div>
      <button id="cart-clear" class="btn btn-ghost">Xoá hết</button>
      <button id="checkout" class="btn btn-primary">Thanh toán</button>
    </div>
  </aside>
  <div id="overlay" class="overlay"></div>

  <footer class="footer">© WEB1044 · FPT Polytechnic · Assignment mẫu</footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
