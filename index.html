<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop cà phê — Bài 8</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>☕ Shop cà phê</h1>
    <button id="lightBtn">Light</button>
    <button id="darkBtn">Dark</button>
  </header>

  <!-- Demo 1 — ba thao tác với localStorage -->
  <section class="box">
    <h2>Ghi nhớ tên người dùng</h2>
    <p>
      <input id="ten" placeholder="Tên của bạn">
      <button id="luu">Lưu</button>
      <button id="xoaTen">Xoá</button>
    </p>
    <p id="out"></p>
  </section>

  <main>
    <section>
      <h2>Sản phẩm</h2>
      <div id="productList" class="grid"></div>
    </section>

    <section>
      <h2>Giỏ hàng</h2>
      <div id="cartBox"></div>
      <p class="total">Tổng: <strong id="cartTotal">0đ</strong></p>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
