<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAB 06 — BOM và DOM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>LAB 06 — BOM và DOM</h1>
  <p class="muted">Mỗi phần dưới đây tương ứng một bài. Code viết trong <code>js/app.js</code>.</p>

  <!-- ============ LAB 6.1 — Cửa sổ thông tin sinh viên ============ -->
  <h2>LAB 6.1 — Cửa sổ thông tin sinh viên</h2>
  <div class="box">
    <button onclick="openStudentInfo()">Mở thông tin sinh viên</button>
  </div>

  <!-- ============ LAB 6.2 — Countdown khuyến mãi ============ -->
  <h2>LAB 6.2 — Countdown khuyến mãi</h2>
  <div class="box">
    <div class="sale-title">BIG SALE</div>
    <div id="countdown" class="countdown">
      <div class="o"><div class="so" id="cd-ngay">00</div><div class="nhan">DAYS</div></div>
      <div class="o"><div class="so" id="cd-gio">00</div><div class="nhan">HOURS</div></div>
      <div class="o"><div class="so" id="cd-phut">00</div><div class="nhan">MINUTES</div></div>
      <div class="o"><div class="so" id="cd-giay">00</div><div class="nhan">SECONDS</div></div>
    </div>
  </div>

  <!-- ============ LAB 6.3 — Render danh sách sản phẩm ============ -->
  <h2>LAB 6.3 — Danh sách sản phẩm</h2>
  <div id="ds"></div>

  <!-- ============ LAB 6.4 — Bảng giỏ hàng ============ -->
  <h2>LAB 6.4 — Giỏ hàng của bạn</h2>
  <div class="box">
    <table>
      <thead>
        <tr>
          <th>Sản phẩm</th>
          <th class="so">Đơn giá</th>
          <th class="so">SL</th>
          <th class="so">Thành tiền</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="gio"></tbody>
    </table>
    <div id="tong"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
